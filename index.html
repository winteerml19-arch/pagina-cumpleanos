<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¡Feliz cumpleaños! 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
/* =========================================================
   COLORES Y TEMAS
   ========================================================= */
:root{
  --noche:#120a2b;
  --tinta:#f5f0ff;
  --suave:#c9bde8;
  --c1:#a855f7; --c2:#f0abfc;
  --mx:0; --my:0;
  --alto:100vh;
}
@supports (height:100svh){ :root{ --alto:100svh; } }

[data-tema="army"]    { --c1:#a855f7; --c2:#f0abfc; }
[data-tema="infinito"]{ --c1:#38bdf8; --c2:#e0f7ff; }
[data-tema="corte"]   { --c1:#34d399; --c2:#e5e7eb; }
[data-tema="stream"]  { --c1:#9146ff; --c2:#ff4d6d; }

*{ box-sizing:border-box; margin:0; padding:0; }
html{ scroll-behavior:auto; }
body{
  background:var(--noche);
  color:var(--tinta);
  font-family:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  overflow-x:hidden;
}
body.bloqueado{ overflow:hidden; }
button{ font:inherit; cursor:pointer; }
:focus-visible{ outline:3px solid #fff; outline-offset:4px; border-radius:8px; }

/* Fondo de color que cambia con cada capítulo */
.aura{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  opacity:0; transition:opacity 1.2s ease;
}
.aura.visible{ opacity:1; }
.aura[data-tema="army"]{ background:radial-gradient(circle at 20% 30%, #5b21b655, transparent 55%), radial-gradient(circle at 80% 80%, #db277744, transparent 50%); }
.aura[data-tema="infinito"]{ background:radial-gradient(circle at 70% 40%, #0369a166, transparent 55%), radial-gradient(circle at 20% 90%, #1e3a8a66, transparent 50%); }
.aura[data-tema="corte"]{ background:radial-gradient(circle at 30% 60%, #06553a66, transparent 55%), radial-gradient(circle at 85% 15%, #37415188, transparent 45%); }
.aura[data-tema="stream"]{ background:radial-gradient(circle at 75% 30%, #6d28d977, transparent 50%), radial-gradient(circle at 15% 85%, #be123c55, transparent 50%); }

#fondo{ position:fixed; inset:0; width:100%; height:100%; z-index:1; pointer-events:none; }
#confeti{ position:fixed; inset:0; width:100%; height:100%; z-index:200; pointer-events:none; }

/* =========================================================
   INTRO
   ========================================================= */
#intro{
  position:fixed; inset:0; z-index:100;
  display:grid; place-items:center; text-align:center;
  background:radial-gradient(circle at 50% 40%, #2e1065, var(--noche) 70%);
  transition:opacity 1s ease, visibility 1s;
  padding:24px;
}
#intro.oculto{ opacity:0; visibility:hidden; }

.regalo{
  background:none; border:none; color:var(--tinta);
  display:flex; flex-direction:column; align-items:center; gap:18px;
}
.regalo .caja{
  font-size:clamp(90px, 22vw, 160px); line-height:1;
  animation:latido 1.6s ease-in-out infinite;
  filter:drop-shadow(0 0 30px #c084fc);
}
.regalo .indicacion{ font-size:1.3rem; color:var(--suave); }
.regalo.abriendo .caja{ animation:abrir .7s cubic-bezier(.5,-0.5,.6,1.4) forwards; }
.regalo.abriendo .indicacion{ opacity:0; transition:opacity .3s; }
@keyframes latido{ 0%,100%{ transform:scale(1) rotate(0); } 25%{ transform:scale(1.08) rotate(-6deg); } 50%{ transform:scale(1) rotate(0); } 75%{ transform:scale(1.08) rotate(6deg); } }
@keyframes abrir{ 0%{ transform:scale(1); } 40%{ transform:scale(1.3) rotate(-10deg); } 100%{ transform:scale(0) rotate(40deg); opacity:0; } }

.saludo{ display:none; }
.saludo.visible{ display:block; }
.saludo h1{
  font-family:"Pacifico", cursive; font-weight:400;
  font-size:clamp(2.6rem, 10vw, 7rem); line-height:1.25;
}
.saludo h1 .linea{ display:block; }
.letra{
  display:inline-block;
  color:hsl(calc(270 + var(--i) * 18) 95% 75%);
  text-shadow:0 0 18px hsl(calc(270 + var(--i) * 18) 95% 60% / .8);
  transform:translateY(-110vh) rotate(-30deg);
  animation:caer .9s cubic-bezier(.3,1.6,.5,1) forwards, flotar-letra 2.4s ease-in-out infinite;
  animation-delay:calc(var(--i) * 90ms), calc(1s + var(--i) * 90ms);
}
.letra.espacio{ width:.35em; }
@keyframes caer{ to{ transform:translateY(0) rotate(0); } }
@keyframes flotar-letra{ 0%,100%{ translate:0 0; } 50%{ translate:0 -10px; } }

.saludo .nombre{
  margin-top:18px; font-size:clamp(1.6rem, 5vw, 2.6rem); font-weight:800;
  opacity:0; animation:aparecer 1s ease forwards; animation-delay:2.4s;
}
.saludo .sub{ color:var(--suave); font-size:1.15rem; margin-top:6px; opacity:0; animation:aparecer 1s ease forwards; animation-delay:3s; }
@keyframes aparecer{ from{ opacity:0; transform:translateY(20px); filter:blur(8px); } to{ opacity:1; transform:none; filter:none; } }

.boton{
  margin-top:34px; border:none; color:#fff;
  padding:14px 30px; border-radius:999px; font-size:1.15rem; font-weight:800;
  background:linear-gradient(135deg, var(--c1), #ec4899);
  box-shadow:0 10px 40px -10px var(--c1);
  transition:transform .2s ease, box-shadow .2s ease;
}
.boton:hover{ transform:translateY(-3px) scale(1.03); box-shadow:0 16px 50px -10px var(--c1); }
#continuar{ opacity:0; pointer-events:none; transition:opacity .8s; }
#continuar.visible{ opacity:1; pointer-events:auto; }
#saltar{
  position:absolute; bottom:max(20px, env(safe-area-inset-bottom)); right:20px;
  background:none; border:none; color:var(--suave); text-decoration:underline; font-size:.95rem;
  display:none;
}

/* =========================================================
   HISTORIA (scroll)
   ========================================================= */
#historia{ position:relative; z-index:2; }
.escenario{
  position:sticky; top:0; height:var(--alto); overflow:hidden;
}
.slide{
  position:absolute; inset:0;
  display:grid; grid-template-columns:1.05fr 1fr; align-items:center;
  gap:5vw; padding:8vh 8vw;
  opacity:0; visibility:hidden;
}
.slide.activa{ opacity:1; visibility:visible; z-index:2; }
.slide.sale{ opacity:1; visibility:visible; z-index:1; }
.slide.invertida .marco-wrap{ order:2; }

.marco-wrap{
  position:relative; justify-self:center; width:min(100%, 440px);
  transform:perspective(1100px) rotateY(calc(var(--mx) * 12deg)) rotateX(calc(var(--my) * -12deg));
  transition:transform .4s ease-out;
}
.marco{
  position:relative; aspect-ratio:4/5; max-height:72vh; width:100%;
  border-radius:28px 28px 28px 6px; overflow:hidden;
  box-shadow:0 0 0 2px color-mix(in srgb, var(--c1) 70%, transparent), 0 30px 80px -20px var(--c1);
  background:#1d1240;
}
.slide.invertida .marco{ border-radius:28px 28px 6px 28px; }
.marco img{ width:100%; height:100%; object-fit:cover; display:block; }
.marco .vacio{
  position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:24px;
  background:linear-gradient(160deg, color-mix(in srgb, var(--c1) 35%, #1d1240), #1d1240);
  color:var(--c2); font-size:1.05rem;
}
.marco .vacio b{ display:block; font-size:3rem; margin-bottom:8px; }
.marco .vacio code{ background:#0006; padding:2px 8px; border-radius:6px; color:#fff; }

.en-vivo{
  position:absolute; top:14px; left:14px; z-index:3;
  background:#e11d48; color:#fff; font-weight:800; font-size:.85rem;
  padding:3px 12px 3px 24px; border-radius:6px;
}
.en-vivo::before{
  content:""; position:absolute; left:9px; top:50%; width:8px; height:8px; margin-top:-4px;
  border-radius:50%; background:#fff; animation:parpadeo 1s infinite;
}
@keyframes parpadeo{ 50%{ opacity:.2; } }

.fx{ position:absolute; inset:-15%; pointer-events:none; z-index:4; }

.texto{ max-width:34ch; }
.etiqueta{
  display:inline-block; font-weight:600; font-size:1rem;
  color:var(--c2); border:1.5px solid color-mix(in srgb, var(--c1) 60%, transparent);
  padding:2px 14px; border-radius:999px; margin-bottom:14px;
}
.texto h2{
  font-size:clamp(2rem, 4.6vw, 3.6rem); line-height:1.05; font-weight:800;
  margin-bottom:16px;
  background:linear-gradient(120deg, #fff 20%, var(--c2) 60%, var(--c1));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.texto p{ font-size:clamp(1.05rem, 1.6vw, 1.3rem); line-height:1.6; color:var(--suave); }

.palabra{ display:inline-block; opacity:0; }
.slide.activa .palabra{
  animation:palabra .7s cubic-bezier(.2,.8,.2,1) forwards;
  animation-delay:calc(.45s + var(--i) * 35ms);
}
@keyframes palabra{ from{ opacity:0; transform:translateY(24px) rotate(4deg); filter:blur(8px); } to{ opacity:1; transform:none; filter:none; } }
.slide.activa .etiqueta{ animation:aparecer .6s ease .3s both; }

/* Salida común */
.slide.sale .marco{ animation:salir .6s ease forwards; }
.slide.sale .texto{ animation:salir-texto .5s ease forwards; }
@keyframes salir{ to{ opacity:0; transform:scale(.8) translateY(-50px) rotate(-4deg); filter:blur(14px); } }
@keyframes salir-texto{ to{ opacity:0; transform:translateY(-40px); filter:blur(10px); } }

/* ---- ARMY: corazones y círculo morado ---- */
.slide[data-tema="army"].activa .marco{ animation:entra-army 1.1s cubic-bezier(.2,.9,.2,1) both; }
@keyframes entra-army{
  from{ clip-path:circle(0% at 50% 50%); transform:scale(1.25) rotate(-10deg); filter:blur(10px) saturate(2); }
  to{ clip-path:circle(80% at 50% 50%); transform:none; filter:none; }
}
.fx .corazon{ position:absolute; bottom:5%; left:var(--x); font-size:var(--t); opacity:0; }
.slide[data-tema="army"].activa .fx .corazon{ animation:subir 4.5s ease-in infinite; animation-delay:var(--d); }
@keyframes subir{
  0%{ opacity:0; transform:translateY(0) scale(.5); }
  15%{ opacity:1; }
  100%{ opacity:0; transform:translateY(-110%) translateX(30px) scale(1.2) rotate(20deg); }
}

/* ---- INFINITO: expansión azul con anillos ---- */
.slide[data-tema="infinito"].activa .marco{ animation:entra-infinito 1.3s cubic-bezier(.16,1,.3,1) both; }
@keyframes entra-infinito{
  0%{ clip-path:circle(0% at 50% 50%); filter:brightness(4) hue-rotate(60deg); }
  45%{ filter:brightness(1.8); }
  100%{ clip-path:circle(85% at 50% 50%); filter:none; }
}
.fx .anillo{
  position:absolute; left:50%; top:50%; width:30%; aspect-ratio:1; border-radius:50%;
  border:2px solid var(--c1); box-shadow:0 0 30px var(--c1), inset 0 0 30px var(--c1);
  transform:translate(-50%,-50%) scale(0); opacity:0;
}
.slide[data-tema="infinito"].activa .fx .anillo{ animation:anillo 1.6s cubic-bezier(.2,.8,.2,1) forwards; animation-delay:var(--d); }
@keyframes anillo{ 0%{ transform:translate(-50%,-50%) scale(0); opacity:1; } 100%{ transform:translate(-50%,-50%) scale(4.5); opacity:0; } }
.slide[data-tema="infinito"].activa .marco-wrap::after{
  content:""; position:absolute; inset:-6%; border-radius:50%; z-index:-1;
  background:radial-gradient(circle, color-mix(in srgb, var(--c1) 45%, transparent), transparent 65%);
  animation:respirar 3s ease-in-out infinite;
}
@keyframes respirar{ 50%{ transform:scale(1.12); opacity:.6; } }

/* ---- CORTE: tajo diagonal ---- */
.slide[data-tema="corte"].activa .marco{ animation:entra-corte .9s cubic-bezier(.7,0,.2,1) .25s both; }
@keyframes entra-corte{
  from{ clip-path:polygon(0 0, 0% 0, -60% 100%, 0 100%); }
  to{ clip-path:polygon(0 0, 160% 0, 100% 100%, 0 100%); }
}
.fx .tajo{
  position:absolute; left:-5%; top:50%; width:110%; height:5px; border-radius:5px;
  background:linear-gradient(90deg, transparent, #fff 40%, var(--c1) 70%, transparent);
  box-shadow:0 0 25px #fff, 0 0 50px var(--c1);
  transform:rotate(var(--r)) scaleX(0); transform-origin:left center; opacity:0;
}
.slide[data-tema="corte"].activa .fx .tajo{ animation:tajo .55s cubic-bezier(.8,0,.2,1) forwards; animation-delay:var(--d); }
@keyframes tajo{
  0%{ transform:rotate(var(--r)) scaleX(0); opacity:1; }
  60%{ transform:rotate(var(--r)) scaleX(1); opacity:1; }
  100%{ transform:rotate(var(--r)) scaleX(1); opacity:0; }
}

/* ---- STREAM: glitch de transmisión ---- */
.slide[data-tema="stream"].activa .marco{ animation:glitch 1s steps(1) both; }
@keyframes glitch{
  0%{ clip-path:inset(45% 0 45% 0); transform:translateX(-25px); filter:hue-rotate(90deg) saturate(3); }
  10%{ clip-path:inset(10% 0 75% 0); transform:translateX(25px); }
  20%{ clip-path:inset(70% 0 5% 0); transform:translateX(-12px); filter:hue-rotate(-60deg); }
  30%{ clip-path:inset(25% 0 40% 0); transform:translateX(18px); }
  40%{ clip-path:inset(0 0 0 0); transform:translateX(-6px); filter:saturate(2) contrast(1.3); }
  55%{ transform:translateX(4px); filter:none; }
  70%,100%{ clip-path:inset(0 0 0 0); transform:none; filter:none; }
}
.fx .lineas{
  position:absolute; inset:15%; border-radius:28px; opacity:0;
  background:repeating-linear-gradient(0deg, #ffffff14 0 2px, transparent 2px 5px);
  mix-blend-mode:overlay;
}
.slide[data-tema="stream"].activa .fx .lineas{ animation:aparecer-lineas 1s ease forwards; }
@keyframes aparecer-lineas{ 0%{ opacity:1; background-color:#9146ff55; } 100%{ opacity:.6; background-color:transparent; } }
.slide[data-tema="stream"].activa .texto h2{ animation:texto-glitch 1s steps(1) .3s both; }
@keyframes texto-glitch{
  0%{ text-shadow:-4px 0 #ff4d6d, 4px 0 #00e5ff; transform:translateX(-6px); }
  20%{ text-shadow:4px 0 #ff4d6d, -4px 0 #00e5ff; transform:translateX(6px); }
  40%{ text-shadow:-2px 0 #ff4d6d, 2px 0 #00e5ff; transform:none; }
  60%,100%{ text-shadow:none; }
}

/* Puntos de progreso */
.puntos{
  position:fixed; right:18px; top:50%; transform:translateY(-50%); z-index:20;
  display:flex; flex-direction:column; gap:12px;
  opacity:0; transition:opacity .4s;
}
.puntos.visible{ opacity:1; }
.puntos button{
  width:12px; height:12px; border-radius:50%; border:2px solid #fff8; background:transparent;
  transition:all .3s;
}
.puntos button.activo{ background:var(--c1); border-color:var(--c2); transform:scale(1.4); box-shadow:0 0 12px var(--c1); }

.pista{
  position:absolute; left:50%; bottom:max(22px, env(safe-area-inset-bottom)); transform:translateX(-50%);
  z-index:5; color:var(--suave); font-size:1rem; text-align:center; transition:opacity .4s;
}
.pista span{ display:block; font-size:1.4rem; animation:rebote 1.4s ease-in-out infinite; }
@keyframes rebote{ 50%{ transform:translateY(8px); } }

/* =========================================================
   FINAL: pastel
   ========================================================= */
#final{
  position:relative; z-index:2; min-height:var(--alto);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:12vh 24px calc(10vh + env(safe-area-inset-bottom));
}
#final h2{
  font-family:"Pacifico", cursive; font-weight:400;
  font-size:clamp(2.2rem, 7vw, 4.4rem);
  color:#f5d0fe; text-shadow:0 0 30px #c084fc;
}
#final .mensaje{ max-width:40ch; font-size:1.2rem; line-height:1.6; color:var(--suave); margin:14px auto 40px; }

.pastel{ position:relative; width:240px; height:220px; margin:0 auto; }
.plato{ position:absolute; bottom:0; left:-20px; right:-20px; height:16px; border-radius:50%; background:linear-gradient(#e9d5ff, #a78bfa); box-shadow:0 10px 30px #0008; }
.piso{ position:absolute; left:50%; transform:translateX(-50%); border-radius:14px 14px 10px 10px; overflow:hidden; }
.piso::before{
  content:""; position:absolute; top:0; left:0; right:0; height:22px;
  background:radial-gradient(circle at 10px 0, #fdf4ff 12px, transparent 13px) 0 0/20px 22px repeat-x, #fdf4ff;
  background:#fdf4ff;
  -webkit-mask:radial-gradient(circle at 10px 22px, transparent 7px, #000 8px) 0 0/20px 22px repeat-x;
          mask:radial-gradient(circle at 10px 22px, transparent 7px, #000 8px) 0 0/20px 22px repeat-x;
}
.piso.abajo{ bottom:10px; width:240px; height:84px; background:linear-gradient(#c084fc, #7c3aed); }
.piso.arriba{ bottom:92px; width:170px; height:68px; background:linear-gradient(#f9a8d4, #db2777); }
.chispas{ position:absolute; inset:28px 10px 8px; background:radial-gradient(circle, #fde68a 2px, transparent 3px) 0 0/26px 22px, radial-gradient(circle, #a5f3fc 2px, transparent 3px) 13px 11px/26px 22px; opacity:.85; }
.velas{ position:absolute; bottom:158px; left:50%; transform:translateX(-50%); display:flex; gap:34px; }
.vela{ position:relative; width:12px; height:44px; border-radius:3px; background:repeating-linear-gradient(-45deg, #fff 0 6px, #60a5fa 6px 12px); }
.llama{
  position:absolute; left:50%; bottom:46px; width:14px; height:24px; margin-left:-7px;
  background:radial-gradient(ellipse at 50% 70%, #fff 0 20%, #fde047 35%, #f97316 70%, transparent 72%);
  border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
  filter:drop-shadow(0 0 10px #fbbf24);
  animation:titilar .25s ease-in-out infinite alternate;
  transform-origin:center bottom; transition:transform .4s, opacity .4s;
}
@keyframes titilar{ from{ transform:scale(1) rotate(-3deg); } to{ transform:scale(1.1, .92) rotate(3deg); } }
.apagada .llama{ animation:none; transform:scale(0); opacity:0; }
.humo{ position:absolute; left:50%; bottom:46px; width:8px; height:8px; margin-left:-4px; border-radius:50%; background:#fff8; opacity:0; }
.apagada .humo{ animation:humo 2s ease-out forwards; }
@keyframes humo{ 0%{ opacity:.8; transform:translateY(0) scale(1); } 100%{ opacity:0; transform:translateY(-70px) translateX(10px) scale(4); } }

#soplar{ margin-top:46px; }
.deseo{ margin-top:28px; font-size:1.5rem; font-weight:800; color:#fde68a; opacity:0; min-height:2.2em; }
.deseo.visible{ animation:aparecer 1s ease forwards; }
.sorpresa{ display:none; position:relative; isolation:isolate; margin:30px auto 10px; }
.sorpresa.visible{ display:inline-block; }
.rayos{
  position:absolute; left:50%; top:50%; width:170%; aspect-ratio:1; z-index:-1;
  transform:translate(-50%,-50%);
  background:repeating-conic-gradient(from 0deg, #fde68a40 0 9deg, transparent 9deg 18deg);
  -webkit-mask:radial-gradient(circle, #000 25%, transparent 68%); mask:radial-gradient(circle, #000 25%, transparent 68%);
  border-radius:50%; animation:girar 14s linear infinite, aparecer-rayos 1.5s ease both;
}
@keyframes girar{ to{ transform:translate(-50%,-50%) rotate(360deg); } }
@keyframes aparecer-rayos{ from{ opacity:0; } to{ opacity:1; } }
.polaroid{
  width:min(78vw, 340px); background:#fffaf5; padding:14px 14px 16px; border-radius:6px;
  box-shadow:0 0 0 3px #f0abfc, 0 0 70px #c084fc, 0 30px 60px #000a;
  animation:revelar 1.6s cubic-bezier(.2,1.3,.4,1) both;
}
@keyframes revelar{
  0%{ opacity:0; transform:scale(0) rotateY(540deg) rotate(-25deg); }
  50%{ opacity:1; }
  100%{ opacity:1; transform:scale(1) rotateY(0) rotate(-3deg); }
}
.polaroid .foto{ position:relative; aspect-ratio:1; overflow:hidden; border-radius:3px; background:#1d1240; }
.polaroid img{ width:100%; height:100%; object-fit:cover; display:block; animation:revelado 2.6s ease .8s both; }
@keyframes revelado{ from{ filter:brightness(3) blur(14px) saturate(0); } to{ filter:none; } }
.polaroid .vacio{ position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:16px; color:#f0abfc; }
.polaroid .vacio b{ display:block; font-size:2.6rem; }
.polaroid .vacio code{ background:#0006; padding:2px 8px; border-radius:6px; color:#fff; }
.polaroid p{ font-family:"Pacifico", cursive; color:#5b21b6; font-size:1.35rem; margin-top:10px; min-height:.5em; }
.twitch{
  display:none; margin-top:18px; color:#fff; text-decoration:none; font-weight:800;
  background:#9146ff; padding:10px 24px; border-radius:12px;
  box-shadow:0 8px 30px -8px #9146ff; transition:transform .2s;
}
.twitch:hover{ transform:translateY(-2px); }
.firma{ margin-top:50px; color:var(--suave); font-size:1rem; }

/* Botón de sonido */
#sonido{
  position:fixed; z-index:150; left:16px; bottom:max(16px, env(safe-area-inset-bottom));
  width:48px; height:48px; border-radius:50%; border:1.5px solid #fff4;
  background:#ffffff14; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  color:#fff; font-size:1.3rem; display:none;
}
#sonido.visible{ display:block; }

/* Celular */
@media (max-width:800px){
  .slide{ grid-template-columns:1fr; grid-template-rows:auto auto; gap:22px; padding:9vh 7vw 12vh; align-content:center; justify-items:center; text-align:center; }
  .slide.invertida .marco-wrap{ order:0; }
  .marco-wrap{ width:min(78vw, 340px); }
  .marco{ max-height:44vh; aspect-ratio:4/4.4; }
  .texto{ max-width:36ch; }
  .texto h2{ font-size:clamp(1.8rem, 8vw, 2.4rem); margin-bottom:8px; }

/* ---------- AUDIO (Web Audio) ---------- */
let ctx = null, master = null, bus = null, silenciado = false;
let loopSintetico = null;

function iniciarAudio(){
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain(); master.gain.value = .9; master.connect(ctx.destination);
  bus = ctx.createGain(); bus.connect(master);
  const eco = ctx.createDelay(); eco.delayTime.value = .27;
  const fb = ctx.createGain(); fb.gain.value = .28;
  const humedo = ctx.createGain(); humedo.gain.value = .22;
  bus.connect(eco); eco.connect(fb); fb.connect(eco); eco.connect(humedo); humedo.connect(master);
}
function frec(n){
  const notas = {C:0, D:2, E:4, F:5, G:7, A:9, B:11};
  const m = n.match(/^([A-G])(#?)(\d)$/);
  const midi = 12 * (parseInt(m[3]) + 1) + notas[m[1]] + (m[2] ? 1 : 0);
  return 440 * Math.pow(2, (midi - 69) / 12);
}
function tono(f, t, dur, vol, tipo = "sine"){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = tipo; o.frequency.value = f;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + .015);
  g.gain.exponentialRampToValueAtTime(.0008, t + dur);
  o.connect(g); g.connect(bus);
  o.start(t); o.stop(t + dur + .05);
}
function campana(n, t, dur, vol = .22){
  const f = frec(n);
  tono(f, t, dur, vol);
  tono(f * 2, t, dur * .5, vol * .25);
  tono(f * 3, t, dur * .25, vol * .08, "triangle");
}
function acorde(notas, t, dur, vol = .05){
  notas.forEach(n => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "triangle"; o.frequency.value = frec(n);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + .25);
    g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + .1);
  });
}

// "Feliz cumpleaños" (melodía tradicional, dominio público)
function tocarCumple(){
  const pulso = .42;
  const mel = [
    ["G4",.75],["G4",.25],["A4",1],["G4",1],["C5",1],["B4",2],
    ["G4",.75],["G4",.25],["A4",1],["G4",1],["D5",1],["C5",2],
    ["G4",.75],["G4",.25],["G5",1],["E5",1],["C5",1],["B4",1],["A4",2],
    ["F5",.75],["F5",.25],["E5",1],["C5",1],["D5",1],["C5",3]
  ];
  const acordes = [[1,["C3","E3","G3"]],[4,["G2","B2","D3"]],[7,["G2","B2","F3"]],[10,["C3","E3","G3"]],
                   [13,["C3","E3","G3"]],[16,["F2","A2","C3"]],[20,["C3","E3","G3"]],[22,["G2","B2","D3"]],[23,["C3","E3","G3"]]];
  const t0 = ctx.currentTime + .15;
  let b = 0;
  mel.forEach(([n, d]) => { campana(n, t0 + b * pulso, Math.max(.5, d * pulso * 1.6)); b += d; });
  acordes.forEach((a, i) => {
    const fin = (acordes[i + 1] ? acordes[i + 1][0] : 26) - a[0];
    acorde(a[1], t0 + a[0] * pulso, fin * pulso);
  });
  return b * pulso * 1000 + 400;
}

// Música de fondo generada (por si no subes una canción)
function iniciarLoop(){
  if (loopSintetico || !ctx) return;
  const prog = [["C4","E4","G4","B4"],["A3","C4","E4","G4"],["F3","A3","C4","E4"],["G3","B3","D4","F4"]];
  const bajos = ["C3","A2","F2","G2"];
  const compas = 2.4, paso = compas / 8;
  let siguiente = ctx.currentTime + .2, n = 0;
  loopSintetico = setInterval(() => {
    while (siguiente < ctx.currentTime + 1){
      const c = Math.floor(n / 8) % 4, i = n % 8;
      const notas = prog[c];
      const orden = [0,1,2,3,2,1,2,3];
      tono(frec(notas[orden[i]]) * 2, siguiente, .9, .045);
      if (i === 0){ acorde([bajos[c]], siguiente, compas, .07); acorde(notas, siguiente, compas, .018); }
      siguiente += paso; n++;
    }
  }, 200);
}
function detenerLoop(){ clearInterval(loopSintetico); loopSintetico = null; }

/* Dos reproductores que se van turnando para hacer un cruce suave entre canciones */
const usarGain = location.protocol.startsWith("http");
const reproductores = [];
const VOL = .6;
let activo = null, pistaActual = null;
const fallidas = new Set(), posiciones = {};

function crearReproductores(){
  if (reproductores.length) return;
  for (let k = 0; k < 2; k++){
    const el = new Audio();
    el.loop = true; el.preload = "auto"; el.setAttribute("playsinline", "");
    let gain = null;
    if (usarGain && ctx){
      try{
        const fuente = ctx.createMediaElementSource(el);
        gain = ctx.createGain(); gain.gain.value = 0;
        fuente.connect(gain); gain.connect(master);
      }catch(e){ gain = null; }
    }
    reproductores.push({ el, gain, fade:null });
  }
  // Desbloquea el segundo reproductor durante el toque (necesario en iPhone)
  const otra = CONFIG.capitulos.map(c => c.musica).find(m => m && m !== CONFIG.capitulos[0].musica) || CONFIG.musicaFondo;
  const r = reproductores[1];
  if (otra){
    r.el.muted = true; r.el.dataset.src = "__desbloqueo"; r.el.src = otra;
    r.el.play().then(() => { if (r.el.dataset.src === "__desbloqueo") r.el.pause(); }).catch(() => {});
  }
}
function fundido(r, destino, dur, alTerminar){
  clearTimeout(r.fade); clearInterval(r.fade);
  if (r.gain){
    const g = r.gain.gain, t = ctx.currentTime;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(destino, t + dur);
    r.fade = setTimeout(() => alTerminar && alTerminar(), dur * 1000 + 60);
    return;
  }
  const inicio = r.el.volume, t0 = performance.now();
  r.fade = setInterval(() => {
    const p = Math.min(1, (performance.now() - t0) / (dur * 1000));
    r.el.volume = inicio + (destino - inicio) * p;
    if (p >= 1){ clearInterval(r.fade); alTerminar && alTerminar(); }
  }, 40);
}
function apagar(r){
  if (!r) return;
  if (r.el.dataset.src) posiciones[r.el.dataset.src] = r.el.currentTime;
  fundido(r, 0, 1.2, () => { if (activo !== r) r.el.pause(); });
}
function usarSintetico(){
  if (pistaActual === "__sintetico") return;
  pistaActual = "__sintetico";
  const r = activo; activo = null; apagar(r);
  iniciarLoop();
}
function ponerMusica(src){
  if (!reproductores.length) return;
  if (src && fallidas.has(src)) src = CONFIG.musicaFondo;
  if (!src || fallidas.has(src)){ usarSintetico(); return; }
  if (src === pistaActual) return;
  pistaActual = src;
  detenerLoop();

  const viejo = activo;
  const nuevo = reproductores.find(r => r !== viejo);
  activo = nuevo;
  apagar(viejo);

  const el = nuevo.el;
  clearTimeout(nuevo.fade); clearInterval(nuevo.fade);
  if (nuevo.gain){ const g = nuevo.gain.gain; g.cancelScheduledValues(ctx.currentTime); g.setValueAtTime(0, ctx.currentTime); el.volume = 1; }
  else el.volume = 0;
  el.muted = silenciado && !nuevo.gain;
  el.dataset.src = src;
  el.src = src + (posiciones[src] ? "#t=" + posiciones[src].toFixed(1) : "");   // retoma donde se quedó

  const fallo = () => {
    if (el.dataset.src !== src) return;
    fallidas.add(src);
    if (pistaActual === src){ pistaActual = null; activo = null; ponerMusica(CONFIG.musicaFondo); }
  };
  el.onerror = fallo;
  el.play().then(() => { if (el.dataset.src === src) fundido(nuevo, VOL, 1.5); })
           .catch(e => { if (e.name !== "AbortError") fallo(); });
}
function musicaDeseada(){
  const fin = document.getElementById("final").getBoundingClientRect().top < innerHeight * .55;
  if (fin && CONFIG.musicaFinal) return CONFIG.musicaFinal;
  const cap = CONFIG.capitulos[Math.max(0, actual)];
  return (cap && cap.musica) || CONFIG.musicaFondo;
}
function whoosh(){
  if (!ctx || silenciado) return;
  const len = ctx.sampleRate * .5, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = ctx.createBufferSource(); s.buffer = buf;
  const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 2;
  f.frequency.setValueAtTime(300, ctx.currentTime); f.frequency.exponentialRampToValueAtTime(3000, ctx.currentTime + .4);
  const g = ctx.createGain(); g.gain.value = .12;
  s.connect(f); f.connect(g); g.connect(master); s.start();
}
$("#sonido").addEventListener("click", () => {
  silenciado = !silenciado;
  if (master) master.gain.value = silenciado ? 0 : .9;

  $("#sonido").textContent = silenciado ? "🔇" : "🔊";
  $("#sonido").setAttribute("aria-label", silenciado ? "Activar música" : "Silenciar música");
});

/* ---------- CONFETI Y FUEGOS ---------- */
const cc = $("#confeti"), cx = cc.getContext("2d");
let piezas = [], animando = false;
const COLORES = ["#a855f7","#f0abfc","#38bdf8","#34d399","#fde047","#fb7185","#ffffff"];
function ajustar(c){ const r = devicePixelRatio || 1; c.width = innerWidth * r; c.height = innerHeight * r; c.getContext("2d").setTransform(r,0,0,r,0,0); }
function confeti(n = 150){
  for (let i = 0; i < n; i++) piezas.push({
    tipo:"papel", x:Math.random() * innerWidth, y:-20 - Math.random() * innerHeight * .5,
    vx:(Math.random() - .5) * 3, vy:2 + Math.random() * 3, r:Math.random() * 6.28, vr:(Math.random() - .5) * .3,
    w:6 + Math.random() * 6, h:10 + Math.random() * 8, color:COLORES[Math.random() * COLORES.length | 0], vida:1
  });
  arrancar();
}
function fuego(x = Math.random() * innerWidth, y = innerHeight * (.15 + Math.random() * .35)){
  const color = COLORES[Math.random() * COLORES.length | 0];
  for (let i = 0; i < 60; i++){
    const a = Math.PI * 2 * i / 60, v = 2 + Math.random() * 4;
    piezas.push({ tipo:"chispa", x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v, color, vida:1 });
  }
  if (ctx && !silenciado) tono(180 + Math.random() * 80, ctx.currentTime, .4, .05, "triangle");
  arrancar();
}
function arrancar(){ if (!animando){ animando = true; requestAnimationFrame(dibujarConfeti); } }
function dibujarConfeti(){
  cx.clearRect(0, 0, innerWidth, innerHeight);
  piezas = piezas.filter(p => p.vida > 0 && p.y < innerHeight + 40);
  for (const p of piezas){
    if (p.tipo === "papel"){
      p.x += p.vx + Math.sin(p.y / 40); p.y += p.vy; p.r += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r);
      cx.fillStyle = p.color; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r)));
      cx.restore();
    } else {
      p.x += p.vx; p.y += p.vy; p.vy += .06; p.vx *= .98; p.vida -= .015;
      cx.globalAlpha = Math.max(0, p.vida);
      cx.fillStyle = p.color; cx.beginPath(); cx.arc(p.x, p.y, 2.4, 0, 6.28); cx.fill();
      cx.globalAlpha = 1;
    }
  }
  if (piezas.length) requestAnimationFrame(dibujarConfeti); else { animando = false; cx.clearRect(0, 0, innerWidth, innerHeight); }
}

/* ---------- PARTÍCULAS DE FONDO ---------- */
const fc = $("#fondo"), fx = fc.getContext("2d");
let temaActual = "army";
const motas = Array.from({length: 70}, () => ({ x:Math.random(), y:Math.random(), v:.0003 + Math.random() * .0008, t:1 + Math.random() * 2.5, f:Math.random() * 6.28 }));
function colorTema(){ return getComputedStyle(document.body).getPropertyValue("--c2").trim() || "#fff"; }
let colorMota = colorTema();
function dibujarFondo(ms){
  fx.clearRect(0, 0, innerWidth, innerHeight);
  fx.fillStyle = colorMota;
  for (const m of motas){
    m.y -= m.v; if (m.y < -.02){ m.y = 1.02; m.x = Math.random(); }
    const x = m.x * innerWidth + Math.sin(ms / 1500 + m.f) * 12, y = m.y * innerHeight;
    fx.globalAlpha = .25 + .35 * Math.sin(ms / 700 + m.f) ** 2;
    if (temaActual === "stream") fx.fillRect(x, y, m.t * 1.6, m.t * 1.6);
    else if (temaActual === "corte"){ fx.fillRect(x, y, 1.2, m.t * 5); }
    else { fx.beginPath(); fx.arc(x, y, m.t, 0, 6.28); fx.fill(); }
  }
  fx.globalAlpha = 1;
  requestAnimationFrame(dibujarFondo);
}
function redimensionar(){ ajustar(cc); ajustar(fc); }
addEventListener("resize", redimensionar); redimensionar();
requestAnimationFrame(dibujarFondo);

/* ---------- INTRO ---------- */
function letras(texto, inicio){
  return [...texto].map((ch, k) => ch === " "
    ? `<span class="letra espacio" style="--i:${inicio + k}"> </span>`
    : `<span class="letra" style="--i:${inicio + k}">${ch}</span>`).join("");
}
$("#tituloIntro").innerHTML = `<span class="linea">${letras("¡Feliz", 0)}</span><span class="linea">${letras("Cumpleaños!", 6)}</span>`;
$("#nombreIntro").textContent = CONFIG.nombre;
$("#subIntro").textContent = CONFIG.subtituloIntro;

let fuegosIntro = null;
$("#abrir").addEventListener("click", () => {
  iniciarAudio(); ctx.resume();
  $("#abrir").classList.add("abriendo");
  $("#saltar").style.display = "block";
  setTimeout(() => {
    $("#abrir").style.display = "none";
    $("#saludo").classList.add("visible");
    confeti(200);
    const dur = tocarCumple();
    fuegosIntro = setInterval(() => fuego(), 900);
    setTimeout(() => confeti(120), dur / 2);
    setTimeout(() => { clearInterval(fuegosIntro); $("#continuar").classList.add("visible"); $("#continuar").focus({preventScroll:true}); }, dur);
  }, 650);
});
function entrar(){
  clearInterval(fuegosIntro);
  if (!ctx){ iniciarAudio(); ctx.resume(); }
  $("#intro").classList.add("oculto");
  document.body.classList.remove("bloqueado");
  $("#sonido").classList.add("visible");
  $("#puntos").classList.add("visible");
  crearReproductores();
  cambiar(0, true);
  ponerMusica(musicaDeseada());
}
$("#continuar").addEventListener("click", entrar);
$("#saltar").addEventListener("click", entrar);

/* ---------- HISTORIA ---------- */
const escenario = $("#escenario"), historia = $("#historia"), puntos = $("#puntos");
const N = CONFIG.capitulos.length;
historia.style.height = `calc(var(--alto) * ${N + 0.6})`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

CONFIG.capitulos.forEach((cap, i) => {
  const tema = TEMAS.includes(cap.tema) ? cap.tema : "army";
  const s = document.createElement("article");
  s.className = "slide" + (i % 2 ? " invertida" : "");
  s.dataset.tema = tema;

  let efectos = "";
  if (tema === "army") efectos = Array.from({length: 9}, (_, k) =>
    `<span class="corazon" style="--x:${8 + k * 10}%;--d:${(k * .47).toFixed(2)}s;--t:${18 + (k % 3) * 8}px">${["💜","🤍","💜"][k % 3]}</span>`).join("");
  if (tema === "infinito") efectos = [0, .25, .5].map(d => `<span class="anillo" style="--d:${d}s"></span>`).join("");
  if (tema === "corte") efectos = `<span class="tajo" style="--r:-38deg;--d:0s;top:85%"></span><span class="tajo" style="--r:22deg;--d:.18s;top:20%"></span>`;
  if (tema === "stream") efectos = `<span class="lineas"></span>`;

  const palabras = esc(cap.texto).split(/\s+/).map((w, k) => `<span class="palabra" style="--i:${k}">${w}</span>`).join(" ");
  s.innerHTML = `
    <div class="marco-wrap">
      <div class="marco">
        ${tema === "stream" ? '<span class="en-vivo">EN VIVO</span>' : ""}
        <img src="${esc(cap.imagen)}" alt="${esc(cap.titulo)}" loading="${i < 2 ? "eager" : "lazy"}">
      </div>
      <div class="fx">${efectos}</div>
    </div>
    <div class="texto">
      <span class="etiqueta">${esc(cap.etiqueta || "")}</span>
      <h2>${esc(cap.titulo)}</h2>
      <p>${palabras}</p>
    </div>`;
  const img = s.querySelector("img");
  img.addEventListener("error", () => {
    img.replaceWith(Object.assign(document.createElement("div"), {
      className:"vacio",
      innerHTML:`<div><b>📷</b>Sube tu foto como<br><code>${esc(cap.imagen)}</code></div>`
    }));
  });
  escenario.appendChild(s);

  const p = document.createElement("button");
  p.setAttribute("aria-label", `Ir a: ${cap.titulo}`);
  p.addEventListener("click", () => irA(i));
  puntos.appendChild(p);
});

const slides = [...escenario.querySelectorAll(".slide")];
const botones = [...puntos.children];
let actual = -1;

function cambiar(i, forzar = false){
  if (i === actual && !forzar) return;
  const previo = slides[actual];
  if (previo && previo !== slides[i]){
    previo.classList.remove("activa"); previo.classList.add("sale");
    setTimeout(() => previo.classList.remove("sale"), 650);
    whoosh();
  }
  const s = slides[i];
  s.classList.remove("sale", "activa");
  void s.offsetWidth;            // reinicia las animaciones
  s.classList.add("activa");
  actual = i;
  temaActual = s.dataset.tema;
  document.body.dataset.tema = temaActual;
  document.querySelectorAll(".aura").forEach(a => a.classList.toggle("visible", a.dataset.tema === temaActual));
  colorMota = colorTema();
  botones.forEach((b, k) => b.classList.toggle("activo", k === i));
  $("#pista").style.opacity = i === 0 ? 1 : 0;
}
function irA(i){
  const alto = historia.offsetHeight - innerHeight;
  window.scrollTo({ top: historia.offsetTop + alto * ((i + .5) / N), behavior:"smooth" });
}
function alDesplazar(){
  if (document.body.classList.contains("bloqueado")) return;
  const r = historia.getBoundingClientRect();
  const total = r.height - innerHeight;
  let p = total > 0 ? -r.top / total : 0;
  p = Math.min(.9999, Math.max(0, p));
  cambiar(Math.floor(p * N));
  ponerMusica(musicaDeseada());
  puntos.classList.toggle("visible", r.bottom > innerHeight * .5);
}
addEventListener("scroll", alDesplazar, {passive:true});

// Inclinación 3D con el mouse / dedo
addEventListener("pointermove", e => {
  document.documentElement.style.setProperty("--mx", (e.clientX / innerWidth - .5).toFixed(3));
  document.documentElement.style.setProperty("--my", (e.clientY / innerHeight - .5).toFixed(3));
});

/* ---------- FINAL ---------- */
$("#tituloFinal").textContent = CONFIG.tituloFinal;
$("#mensajeFinal").textContent = CONFIG.mensajeFinal;
$("#firma").textContent = CONFIG.deParte;
(function(){
  const caja = $("#fotoSorpresa");
  const img = new Image();
  img.alt = "Foto sorpresa";
  img.addEventListener("error", () => {
    caja.innerHTML = `<div class="vacio"><div><b>🎁</b>Sube tu foto sorpresa como<br><code>${esc(CONFIG.imagenSorpresa)}</code></div></div>`;
  });
  img.src = CONFIG.imagenSorpresa;
  caja.appendChild(img);
  $("#textoSorpresa").textContent = CONFIG.textoSorpresa || "";
})();
let tiempoSorpresa = null;
if (CONFIG.canalTwitch){ $("#twitch").href = CONFIG.canalTwitch; $("#twitch").style.display = "inline-block"; }

$("#soplar").addEventListener("click", () => {
  const pastel = $("#pastel");
  if (pastel.classList.contains("apagada")){
    pastel.classList.remove("apagada"); $("#deseo").classList.remove("visible");
    clearTimeout(tiempoSorpresa); $("#sorpresa").classList.remove("visible");
    $("#soplar").textContent = "Pide un deseo y sopla las velas 🌬️";
    return;
  }
  pastel.classList.add("apagada");
  $("#deseo").textContent = CONFIG.textoDeseo;
  $("#deseo").classList.add("visible");
  $("#soplar").textContent = "Volver a encender 🕯️";
  confeti(220);
  tiempoSorpresa = setTimeout(() => {
    const s = $("#sorpresa");
    s.classList.remove("visible"); void s.offsetWidth; s.classList.add("visible");
    if (ctx && !silenciado){ const t = ctx.currentTime; ["G5","C6","E6","G6"].forEach((n, k) => campana(n, t + k * .09, 1.4, .14)); }
    setTimeout(() => s.scrollIntoView({ behavior:"smooth", block:"center" }), 300);
  }, 1100);
  [0, 400, 800, 1300, 1800].forEach(t => setTimeout(() => fuego(), t));
  if (ctx && !silenciado){
    const t = ctx.currentTime;
    ["C5","E5","G5","C6"].forEach((n, k) => campana(n, t + k * .12, 1.2, .18));
  }
});
</script>
</body>
</html>
